# fuzzel in the XFCE demo session (M7 m7i-xfce-demo): stage as
# /etc/xdg/xfce-demo/fuzzel/fuzzel.ini (first in the session's XDG_CONFIG_DIRS). As m7c's
# /etc/xdg/fuzzel/fuzzel.ini, with Terminal=true entries run in foot-2 and the icon theme on
# (the XFCE session has Adwaita + hicolor PNGs).
[main]
font=DejaVu Sans:size=14
terminal=/bin/foot-2 -e
icon-theme=Adwaita
icons-enabled=yes
lines=8
width=40
prompt="Run: "

[colors]
background=1b1f2bee
text=d8dee9ff
match=f0a060ff
selection=3b4252ff
selection-text=ffffffff
border=f0a060ff
