# fuzzel in the XFCE session: /etc/xdg/xfce-session/fuzzel/fuzzel.ini (first in the
# session's XDG_CONFIG_DIRS). As the plain /etc/xdg/fuzzel/fuzzel.ini, with
# Terminal=true entries run in foot and the icon theme on (the XFCE session has Adwaita +
# hicolor PNGs).
[main]
font=DejaVu Sans:size=14
terminal=/bin/foot -e
icon-theme=Adwaita
icons-enabled=yes
lines=8
width=40
prompt="Run: "

[colors]
background=1b1f2bee
text=d8dee9ff
match=f0a060ff
selection=3b4252ff
selection-text=ffffffff
border=f0a060ff
