# GTK 3 defaults for the Phoenix-RTOS Wayland desktop (M7), staged as
# /etc/xdg/gtk-3.0/settings.ini. GTK's built-in Adwaita theme and icons; the one font
# family on the NFS root (DejaVu, /etc/fonts/fonts.conf); no animations (every frame is
# drawn by the CPU into a wl_shm buffer).
[Settings]
gtk-theme-name=Adwaita
gtk-icon-theme-name=Adwaita
gtk-fallback-icon-theme=hicolor
gtk-font-name=DejaVu Sans 11
gtk-enable-animations=false
gtk-cursor-blink=false
gtk-application-prefer-dark-theme=false
