# fuzzel on Phoenix-RTOS (M7 m7c-desktop): stage as /etc/xdg/fuzzel/fuzzel.ini.
# Applications come from /usr/share/applications/*.desktop (foot, mc, bash staged
# there); Terminal=true entries run in foot. No icon theme on the export.
[main]
font=DejaVu Sans:size=14
terminal=/bin/foot -e
icons-enabled=no
lines=8
width=40
prompt="Run: "

[colors]
background=1b1f2bee
text=d8dee9ff
match=f0a060ff
selection=3b4252ff
selection-text=ffffffff
border=f0a060ff
