# foot on Phoenix-RTOS (M7): stage as /etc/xdg/foot/foot.ini.
#
# TERM: Phoenix has no terminfo database; its ncurses compiles xterm-256color in
# (--with-fallbacks), so mc, nano and bash work with it. foot's own "foot"
# terminfo entry is not needed.

[main]
term=xterm-256color
shell=/bin/bash
font=DejaVu Sans Mono:size=11
dpi-aware=no
# 80x24 (~720x456 px): each wl_shm buffer is one physically contiguous shmsrv object
# (a power of two >= 1 MiB); a maximized 1080p window needs 8 MiB blocks
initial-window-size-chars=80x24
title=foot

[scrollback]
lines=2000

[cursor]
style=block
blink=no

[tweak]
# no 512 MiB scrollable wl_shm pools: memfds are physically contiguous shmsrv
# objects here (foot patch 0001 makes this the default on Phoenix-RTOS too)
max-shm-pool-size-mb=0
