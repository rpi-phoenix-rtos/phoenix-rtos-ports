# weston-drm (new GPU lane, M6): Weston on the DRM backend of rpi4-kms.
# Stage as /etc/xdg/weston/weston-drm.ini; the Pi script passes it with --config.
# Command-line options of the script (--backend, --renderer, --shell,
# --continue-without-input) override the [core] keys below.

[core]
backend=drm
shell=kiosk
require-input=false
idle-time=0

[output]
# rpi4-kms reports one HDMI-A connector with the firmware's mode (M2).
name=HDMI-A-1
mode=current

[keyboard]
# No xkeyboard-config on Phoenix: these names fail to compile at run time and
# Weston falls back to the keymap baked into the binary (evdev/pc105/us,
# weston patch 0003) -- the same keymap these names describe.
keymap_rules=evdev
keymap_model=pc105
keymap_layout=us
