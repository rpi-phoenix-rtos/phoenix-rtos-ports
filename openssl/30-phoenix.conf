#phoenix
#
# Phoenix-RTOS Configure targets for OpenSSL 3.x (Configurations/ format of 3.0+:
# the CPU-specific assembler is chosen with asm_arch + perlasm_scheme; the 1.1.1
# asm("<arch>_asm") inheritance no longer exists).
#
# Target name = phoenix-${TARGET_FAMILY}-${TARGET_SUBFAMILY} (see port.def.sh).
# The port framework's CFLAGS/LDFLAGS (sysroot, -mcpu, -mstrict-align, ...) are
# passed through the environment and land in $(CFLAGS)/$(LDFLAGS); the cflags
# below are the target's own CNF_CFLAGS and are applied before them.

my %targets = (
	"phoenix" => {
		template         => 1,
		inherit_from     => [ "BASE_unix" ],
		sys_id           => "PHOENIX_RTOS",
		defines          => add("OPENSSL_SYS_PHOENIX"),
		thread_scheme    => "pthreads",
		# What is off, and why:
		#   shared, pic, module, dso, dynamic-engine -- everything links
		#     statically; with `module` off the legacy provider (MD4, DES, ...)
		#     is compiled INTO libcrypto instead of being a loadable .so, so
		#     OSSL_PROVIDER_try_load(NULL, "legacy", 1) still works (wpa_supplicant
		#     loads it for MSCHAPv2/MD4).
		#   async -- 3.x's ASYNC job backend is ucontext based and libphoenix
		#     has no getcontext/makecontext/swapcontext. No consumer uses ASYNC
		#     jobs; disabled rather than left to the header autodetection.
		#   afalgeng, devcryptoeng -- Linux-only kernel crypto interfaces.
		#   tests -- not built for the target.
		# tls1_3 is deliberately NOT disabled (it was, as an unrecorded inherited
		# pin, until 2026-09-05: python's ssl then reported `TLS 1.3 available:
		# False` on hardware). Threads are on (thread_scheme above): CPython's
		# _ssl needs a thread-safe libcrypto, and libphoenix has the pthread
		# once/key/mutex/rwlock/condvar primitives 3.x uses.
		disable          => [ "shared", "pic", "module", "dso", "dynamic-engine",
		                      "async", "afalgeng", "devcryptoeng", "tests" ],
	},

	"phoenix-armv7a7-imx6ull" => {
		inherit_from     => [ "phoenix" ],
		asm_arch         => "armv4",
		perlasm_scheme   => "void",
		cc               => "arm-phoenix-gcc",
		ld               => "arm-phoenix-ld",
		ranlib           => "arm-phoenix-gcc-ranlib",
		cflags           => "-Os -Wall -Wstrict-prototypes -g -mcpu=cortex-a7 -mtune=cortex-a7 -mfpu=neon-vfpv4 -mfloat-abi=hard -mthumb -fomit-frame-pointer -mno-unaligned-access -fdata-sections -ffunction-sections -Wl,--gc-sections -Wl,-z,max-page-size=0x1000",
		arflags          => "-r",
	},

	"phoenix-aarch64a72-generic" => {
		inherit_from     => [ "phoenix" ],
		asm_arch         => "aarch64",
		perlasm_scheme   => "linux64",
		cc               => "aarch64-phoenix-gcc",
		ld               => "aarch64-phoenix-ld",
		ranlib           => "aarch64-phoenix-gcc-ranlib",
		# -O2, not the -Os of the small targets: the Pi 4 is not size-bound, and
		# the hot paths with no aarch64 assembler are plain C -- X25519 and the
		# ML-KEM half of 3.5's default X25519MLKEM768 key share, P-384/P-521.
		# (AES, SHA-1/2/3, P-256 and Poly1305 use the armv8 assembler either way.)
		cflags           => "-O2 -Wall -Wstrict-prototypes -g -mcpu=cortex-a72 -mtune=cortex-a72 -fomit-frame-pointer -fdata-sections -ffunction-sections -Wl,--gc-sections -Wl,-z,max-page-size=0x1000",
		arflags          => "-r",
		# 64-bit target: MUST use 64-bit bignum limbs. Without this, bn_ops defaults
		# to THIRTY_TWO_BIT while the aarch64 asm uses 64-bit limbs -> size mismatch
		# -> heap overflow during crypto (corrupts allocator metadata; crashed the
		# TLS handshake). Matches the stock linux-aarch64 target.
		bn_ops           => "SIXTY_FOUR_BIT_LONG RC4_CHAR",
	},

	"phoenix-ia32-generic" => {
		inherit_from     => [ "phoenix" ],
		asm_arch         => "x86",
		perlasm_scheme   => "elf",
		cc               => "i386-pc-phoenix-gcc",
		ld               => "i386-pc-phoenix-ld",
		ranlib           => "i386-pc-phoenix-gcc-ranlib",
		cflags           => "-Os -march=i586 -mtune=generic -Wall -Wstrict-prototypes -g -fomit-frame-pointer -fdata-sections -ffunction-sections",
		arflags          => "-r",
	},

	# No asm_arch: OpenSSL 3.x has riscv64 assembler, but it has never been
	# exercised on Phoenix, so the portable C code is used.
	"phoenix-riscv64-generic" => {
		inherit_from     => [ "phoenix" ],
		cc               => "riscv64-phoenix-gcc",
		ld               => "riscv64-phoenix-ld",
		ranlib           => "riscv64-phoenix-gcc-ranlib",
		cflags           => "-Os -Wall -Wstrict-prototypes -fomit-frame-pointer -ffreestanding -mcmodel=medany",
		arflags          => "-r",
		bn_ops           => "SIXTY_FOUR_BIT_LONG RC4_CHAR", # 64-bit target (see aarch64 note)
	},
);
