<!-- STAGE 2 (SO_PEERCRED): EXTERNAL first, ANONYMOUS as the fallback.
     Phoenix-RTOS Pi 4 session bus (tools/gpu-lane/dbus, docs/gpu-new-lane/M7-wayland-desktop.md).
     Not installed in the image: tools/gpu-lane/dbus/hosttest/run.sh starts dbus-daemon with it (cases B-D).
     Clients:     DBUS_SESSION_BUS_ADDRESS=unix:path=/tmp/dbus-session  (no autolaunch on Phoenix)

     LAB ONLY: ANONYMOUS + allow_anonymous lets ANY process that can reach the socket onto the bus
     with no identity. Acceptable on this single-user test system; never make it a default. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <type>session</type>
  <keep_umask/>

  <!-- A plain path (Phoenix has no abstract sockets). dbus-daemon does not remove a stale
       socket file: the launcher does, before it starts the bus. -->
  <listen>unix:path=/tmp/dbus-session</listen>

  <!-- EXTERNAL succeeds when dbus-daemon was built against a sysroot with SO_PEERCRED and the
       kernel answers it; otherwise the daemon REJECTs it and the client retries ANONYMOUS.
       Keep ANONYMOUS (and allow_anonymous) even with SO_PEERCRED: libdbus clients (dbus-send,
       dbus-monitor) then authenticate EXTERNAL, but GDBus clients (every GTK/XFCE program)
       cannot until glib gets a Phoenix credentials case. Their EXTERNAL claims uid -1, is
       REJECTed, and they fall back to ANONYMOUS. -->
  <auth>EXTERNAL</auth>
  <auth>ANONYMOUS</auth>
  <allow_anonymous/>

  <!-- No <standard_session_servicedirs/>, no <include>/<includedir>: every path is explicit.
       Activatable services (.service files, e.g. org.xfce.Xfconf) go here. -->
  <servicedir>/usr/share/dbus-1/services</servicedir>

  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>

  <!-- upstream session.conf limits (caps, not reservations) -->
  <limit name="max_incoming_bytes">1000000000</limit>
  <limit name="max_incoming_unix_fds">250000000</limit>
  <limit name="max_outgoing_bytes">1000000000</limit>
  <limit name="max_outgoing_unix_fds">250000000</limit>
  <limit name="max_message_size">1000000000</limit>
  <limit name="service_start_timeout">120000</limit>
  <limit name="auth_timeout">240000</limit>
  <limit name="pending_fd_timeout">150000</limit>
  <limit name="max_completed_connections">100000</limit>
  <limit name="max_incomplete_connections">10000</limit>
  <limit name="max_connections_per_user">100000</limit>
  <limit name="max_pending_service_starts">10000</limit>
  <limit name="max_names_per_connection">50000</limit>
  <limit name="max_match_rules_per_connection">50000</limit>
  <limit name="max_replies_per_connection">50000</limit>
</busconfig>
