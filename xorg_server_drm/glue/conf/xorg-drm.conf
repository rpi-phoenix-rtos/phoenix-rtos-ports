# Xorg-drm (new GPU lane, M4): X.Org modesetting + glamor on rpi4-kms / rpi4-v3d-async.
# Stage as <export>/etc/X11/xorg-drm.conf; start with  Xorg-drm :1 -config /etc/X11/xorg-drm.conf
# docs/gpu-new-lane/M4-xorg-modesetting.md explains every option.

Section "ServerFlags"
	# No udev/hal: devices come only from this file.
	Option "AutoAddDevices" "false"
	Option "AutoAddGPU" "false"
	# No virtual terminals on Phoenix.
	Option "DontVTSwitch" "true"
	# Keep the screen on for the whole test (no screensaver, no DPMS blanking).
	Option "BlankTime" "0"
	Option "StandbyTime" "0"
	Option "SuspendTime" "0"
	Option "OffTime" "0"
EndSection

# No "Module" section: every module Xorg-drm uses is linked in (builtin-module table)
# and loaded on demand by name; GLX is not built, so there are no default modules.

Section "Device"
	Identifier "rpi4-kms"
	Driver "modesetting"
	# card0 = rpi4-kms (display); glamor finds the render node renderD128 = rpi4-v3d-async
	# through libdrm-phoenix / Mesa kmsro.
	Option "kmsdev" "/dev/dri/card0"
	Option "AccelMethod" "glamor"
	# glamor tries desktop GL first, then GLES; the default Mesa-DRM build is GLES-only
	# (GLES 3.1 on V3D 4.2). Uncomment to skip the desktop-GL attempt explicitly:
	#Option "RenderingAPI" "es"
	# DRM_IOCTL_MODE_CURSOR is a stub in libdrm-phoenix (M3 §3.2): software cursor.
	Option "SWcursor" "on"
	# Present flips of full-screen windows (needs a client buffer rpi4-kms can scan out).
	Option "PageFlip" "on"
EndSection

Section "Screen"
	Identifier "screen0"
	Device "rpi4-kms"
	DefaultDepth 24
EndSection

Section "InputDevice"
	Identifier "kbd0"
	Driver "phxhid"
	Option "Device" "/dev/kbd0"
	Option "Type" "keyboard"
EndSection

Section "InputDevice"
	Identifier "mouse0"
	Driver "phxhid"
	Option "Device" "/dev/mouse0"
	Option "Type" "mouse"
EndSection

Section "ServerLayout"
	Identifier "layout0"
	Screen "screen0"
	InputDevice "kbd0" "CoreKeyboard"
	InputDevice "mouse0" "CorePointer"
EndSection
